<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173c34">
<meta name="description" content="Map-first field workspace with on-demand reviewed project notifications; internal Daily Progress and Sources.">
<title>Project Map · A9 Site Operations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="./styles.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script defer src="./app.js"></script>
</head>
<body class="field-home" data-jp-no-gallery>
<a class="skip" href="#main">Skip to dashboard</a>
<header class="north">
  <div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><div><span class="eyebrow">A9 · Site operations</span><strong>JP Site <span>Operations</span></strong></div></div>
  <nav class="desktop-nav compact-nav" aria-label="Site navigation">
<a href="./#map" aria-current="page">Map</a>
<a href="./#notifications">Notifications</a>

</nav>
</header>
<div class="workbench">
<aside class="west" id="navigation-panel" aria-labelledby="navigation-label">
  <span id="navigation-label" class="visually-hidden">Sites</span>
  <h2>Sites</h2>
  <label for="project-filter">Site / project</label>
  <select id="project-filter"><option value="">All sites</option></select>
  <label class="desktop-status-label" for="status-filter">Status</label>
  <select id="status-filter" class="desktop-status-control" aria-describedby="status-source-hint">
    <option value="all">Current (excludes completed)</option>
    <option value="Construction">Under construction</option>
    <option value="Completed">Completed</option>
    <option value="Approval">Approval</option>
    <option value="Maintenance">Maintenance</option>
    <option value="unpublished">Not stated / other</option>
  </select>
  <span id="status-source-hint" hidden></span>
  <label for="company-filter">Company</label>
  <select id="company-filter"><option value="">All companies</option></select>
  <button type="button" id="reset-filters" class="quiet">Reset</button>
  <div class="side-divider"></div>
  <button id="directory-toggle" class="directory-toggle" type="button" aria-controls="project-list" aria-expanded="false">Sites <span id="project-count" class="count">—</span></button>
  <div id="project-list" class="project-list" aria-live="polite"><p>Loading approved project listings…</p></div>
  
</aside>
<main id="main" class="centre">
  <span id="receipt" class="visually-hidden" role="status"></span>
  <section id="map" class="surface map-section" aria-labelledby="map-title">
    <div class="section-head"><div><h2 id="map-title">Project map</h2></div></div>
    <div class="field-toolbar"><div class="view-switch" role="group" aria-label="Site view"><button type="button" id="geo-view" aria-pressed="true">Map</button><button type="button" id="resource-view" aria-pressed="false">Materials &amp; Labour</button></div><button type="button" id="field-filter-toggle" aria-expanded="false" aria-controls="field-filter-drawer">Filters</button></div>
    <div id="field-filter-drawer" class="field-filter-drawer">
    <details class="advanced-map-settings"><summary>Map layers</summary><div class="map-modes" role="group" aria-label="Choose site information layer">
      <button type="button" data-map-mode="projects" aria-pressed="false">Sites</button>
      <button type="button" data-map-mode="work" aria-pressed="false">Work</button>
      <button type="button" data-map-mode="activities" aria-pressed="true">Notifications</button>
    </div></details>
    <div class="mobile-status-filter" aria-label="Filter sites by recorded project status">
      <div class="mobile-filter-heading"><strong>Status</strong></div>
      <div class="status-chip-scroll" role="group" aria-label="Project status filter">
        <button type="button" data-project-status="all" aria-pressed="true">Current <span data-status-count="all">—</span></button>
        <button type="button" data-project-status="Construction" aria-pressed="false">Construction <span data-status-count="Construction">—</span></button>
        <button type="button" data-project-status="Completed" aria-pressed="false">Completed <span data-status-count="Completed">—</span></button>
        <button type="button" data-project-status="Approval" aria-pressed="false">Approval <span data-status-count="Approval">—</span></button>
        <button type="button" data-project-status="Maintenance" aria-pressed="false">Maintenance <span data-status-count="Maintenance">—</span></button>
        <button type="button" data-project-status="unpublished" aria-pressed="false">Not stated <span data-status-count="unpublished">—</span></button>
      </div>
      <p id="status-filter-summary" class="status-filter-summary" role="status" aria-live="polite"></p>
    </div>
    
    
    <div class="map-field-actions"><span id="map-selection-hint" hidden></span><button id="clear-map-selection" type="button" hidden>All sites</button></div>
    <div class="company-legend" aria-label="Map colours by executing organization">
      
      <ul id="company-legend" aria-live="polite"></ul>
    </div>
    <div class="scout-settings"><button id="scout-motion" class="scout-motion" type="button" aria-pressed="false">Pause Scout</button></div>
    </div>
    <p id="attention-count" class="field-attention" role="status"></p>
    <div id="map-canvas" role="region" aria-label="Interactive project location map" tabindex="0"></div>
    <section id="resource-desk" class="resource-desk" hidden aria-label="Materials and labour"><div class="resource-tabs" role="group" aria-label="Resource type"><button type="button" data-resource-tab="materials" aria-pressed="true">Materials</button><button type="button" data-resource-tab="stock" aria-pressed="false">On site</button><button type="button" data-resource-tab="labour" aria-pressed="false">Labour</button></div><label for="resource-site" class="resource-label">Site</label><select id="resource-site"><option value="">All current sites</option></select><div id="resource-rows" aria-live="polite"></div></section>
    <p id="map-fallback" class="help" hidden>Map unavailable</p>

  </section>
  <section id="notifications" class="surface notification-centre" hidden aria-labelledby="notifications-title">
    <div class="section-head"><div><h2 id="notifications-title" tabindex="-1">Notifications</h2></div></div>
    <div class="detail-actions"><button type="button" id="back-to-sites" aria-label="Back to all sites">← Map</button></div>
    
    <div class="notice-dashboard">
      <div class="notice-dashboard-top">
        <div><h3 id="notice-focus-title">All sites</h3></div>
        <div class="notice-summary" aria-live="polite"><strong id="notice-total">—</strong><span>Notifications</span></div>
      </div>
      <label for="notice-site" class="notice-label">Site</label>
      <select id="notice-site"><option value="">All sites</option></select>
      <div class="notice-category-tabs" role="group" aria-label="Filter notifications by recorded category">
        <button class="secondary-notice-tab" type="button" data-notice-category="all" aria-pressed="false">All <span data-notice-count="all">—</span></button>
        <button type="button" data-notice-category="Work" aria-pressed="true">Work <span data-notice-count="Work">—</span></button>
        <button type="button" data-notice-category="Materials" aria-pressed="false">Materials <span data-notice-count="Materials">—</span></button>
        <button class="secondary-notice-tab" type="button" data-notice-category="Supervision" aria-pressed="false">Supervision <span data-notice-count="Supervision">—</span></button>
      </div>
      <div id="notice-list" class="cards notice-list" aria-live="polite"><p></p></div>
      
      
    </div>
  </section>



</main>

</div>

<noscript><p class="nojs">Enable JavaScript to view the map.</p></noscript>
<div class="site-scout scout-roaming" id="site-scout" aria-hidden="true"><svg viewBox="0 0 72 72" width="48" height="48"><rect x="12" y="28" width="48" height="32" rx="13" fill="#eaf5ed" stroke="#1a624c" stroke-width="3"/><path d="M16 29V24a20 20 0 0 1 40 0v5M11 29h50" fill="#f6c84e" stroke="#784d16" stroke-width="3" stroke-linejoin="round"/><path d="M36 8v13" stroke="#784d16" stroke-width="3"/><circle cx="26" cy="41" r="3" fill="#173c34"/><circle cx="46" cy="41" r="3" fill="#173c34"/><path d="M29 49q7 5 14 0" fill="none" stroke="#173c34" stroke-width="2.5" stroke-linecap="round"/><rect x="45" y="50" width="21" height="18" rx="3" fill="#fff" stroke="#246b9a" stroke-width="2"/><path d="m49 57 3 3 6-7" fill="none" stroke="#1a624c" stroke-width="2" stroke-linecap="round"/></svg></div>
</body></html>
