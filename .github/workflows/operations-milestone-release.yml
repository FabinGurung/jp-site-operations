name: JP Operations — Approved Source-first Release Milestones
on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v3.3.0.md'
      - 'docs/releases/v3.4.0.md'
      - '.github/workflows/operations-milestone-release.yml'
  workflow_run:
    workflows: ["Operations from Google Sheets"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact approved release notes tag
        type: choice
        options: [v3.3.0, v3.4.0]
        required: true
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source contracts and branch governance
        run: |
          python -m unittest discover -s scripts -p 'test_ops_publication.py' -v
          python scripts/validate_branch_registry.py
          python -m unittest discover -s scripts -p 'test_ops_semantic_docs.py' -v
      - name: Tag approved baseline or retrofit milestone
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tags="$REQUESTED"
          else
            tags="v3.3.0"
          fi
          if [ "$tags" = "v3.4.0" ]; then
            echo "::error::v3.4.0 must be released by a successfully deployed Google Docs + Sheets Pages workflow"
            exit 1
          fi
          for tag in $tags; do
            notes="docs/releases/$tag.md"
            test -f "$notes" || continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Existing immutable release $tag retained"
              continue
            fi
            # The baseline must not be fabricated on unrelated later commits.
            if [ "$tag" = "v3.3.0" ] && [ "$EVENT" != "workflow_dispatch" ] &&
               ! git show --format= --name-only HEAD | grep -Fxq "$notes"; then
              continue
            fi
            if [ "$tag" = "v3.4.0" ] &&
               ! git show --format= --name-only HEAD | grep -Fxq "$notes"; then
              echo "v3.4 release requires notes in the current reviewed commit"
              continue
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "JP Site Operations — $tag" --notes-file "$notes"
            echo "Created immutable release $tag at $GITHUB_SHA"
          done

  release-after-deployment:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Publish approved semantic milestone only after Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/v3.4.0.md"
          test -f "$notes" || { echo 'Semantic release notes not published yet'; exit 0; }
          if gh release view v3.4.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing immutable v3.4.0 release retained'
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv' > /tmp/release-jobs
          grep -Fxq $'project\tsuccess' /tmp/release-jobs || { echo 'Source projection not confirmed'; exit 0; }
          grep -Fxq $'deploy\tsuccess' /tmp/release-jobs || { echo 'Pages deployment not confirmed'; exit 0; }
          python -m unittest discover -s scripts -p 'test_ops_semantic_docs.py' -v
          gh release create v3.4.0 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title 'JP Site Operations — Google Sheets + Semantic Google Docs v3.4.0' \
            --notes-file "$notes"
          echo "v3.4.0 deployed and tagged at $SOURCE_SHA"
