name: Operations static publication
on:
  pull_request:
    paths:
      - 'publication/static-operations/**'
      - 'publication/static-operations-manifest.json'
      - '.github/workflows/operations-sheets-pages.yml'
  push:
    branches:
      - main
      - feature/daily-ops-current-work
    paths:
      - 'publication/static-operations/**'
      - 'publication/static-operations-manifest.json'
      - '.github/workflows/operations-sheets-pages.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the already prepared static release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ops-static-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact prepared artifact and public schema
        shell: python
        run: |
          import hashlib, json, pathlib, re
          root = pathlib.Path('publication/static-operations')
          m = json.loads(pathlib.Path('publication/static-operations-manifest.json').read_text())
          assert m['schema'] == 'JP_STATIC_RELEASE_V1'
          assert m['source_authority'] == 'GOOGLE_DOCS_AND_SHEETS'
          assert m['prepared_by'] == 'AI_CODE_MODE'
          assert m['counts']['semantic_contracts'] == 7
          paths = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert paths == set(m['files']), 'Unexpected or missing artifact files'
          assert {'.nojekyll','index.html','app.js','styles.css','operations.json','closed-work.json','site-updates.json','extraction-status.json'} <= paths
          for name, digest in m['files'].items():
              p = root / name
              assert not p.is_symlink() and '..' not in pathlib.PurePosixPath(name).parts
              assert name == '.nojekyll' or re.fullmatch(r'[a-z0-9-]+(?:/[a-z0-9-]+)*\.(html|js|css|json)', name), name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, name
              if p.suffix == '.json': json.loads(p.read_text())
          data = json.loads((root/'operations.json').read_text())
          counts = m['counts']
          assert data['provenance']['publication_engine'] == 'AI_PREPARED_STATIC_V1'
          assert data['provenance']['live_workbook_count'] == 7
          assert data['provenance']['semantic_google_docs_status'] == 'GOOGLE_DOCS_VERIFIED'
          assert data['provenance']['registered_google_docs_checked'] == counts['original_docs']
          assert data['provenance']['reviewed_google_doc_quotes_checked'] == counts['quotes']
          pids = {r['id'] for r in data['projects']}
          assert len(pids) == len(data['projects']) == counts['projects']
          assert 'PRJ-000030' not in pids
          assert all(re.fullmatch(r'PRJ-[0-9]{6}', p) for p in pids)
          assert len(data['notices']) == counts['notices']
          assert len(data['progress']) == counts['progress']
          assert all(r['project_id'] in pids for r in data['notices']+data['progress'])
          assert len({r['notification_id'] for r in data['notices']}) == len(data['notices'])
          assert all(set(r) <= {'id','name','status','ward','site','quality','company_id','company','lat','lng'} for r in data['projects'])
          assert all(set(r) <= {'notification_id','project_id','category','instruction','due_date','display_order','date','quantity','unit','source_doc_url'} for r in data['notices'])
          assert all(set(r) == {'id','project_id','work','status','date','verification'} for r in data['progress'])
          closed = json.loads((root/'closed-work.json').read_text())
          assert closed['total'] == len(closed['records']) == counts['closed']
          assert all(set(r) <= {'id','kind','project_id','project_name','summary','category','source_date','decision','decision_label','closed_on'} and r['project_id'] in pids for r in closed['records'])
          updates = json.loads((root/'site-updates.json').read_text())
          assert updates['summary']['public_site_count'] == counts['projects']
          assert updates['summary']['reviewed_notice_count'] == counts['notices']
          assert updates['summary']['published_work_report_count'] == counts['progress']
          assert {s['project_id'] for s in updates['site_summaries']} == pids
          extraction = json.loads((root/'extraction-status.json').read_text())
          assert extraction['public_counts']['projects'] == counts['projects']
          assert extraction['public_counts']['reviewed_notices'] == counts['notices']
          assert extraction['public_counts']['work_reports'] == counts['progress']
          home = (root/'index.html').read_text()
          assert 'id="resource-view"' in home and 'id="map-canvas"' in home
          assert 'data-jp-no-gallery' in home and 'data-jp-source-gallery' not in home
          assert 'Earlier notifications in Google Drive' not in home
          assert 'Resolution not recorded' not in home
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'a' and 'href' in a:
                      self.hrefs.append(a['href'])
          assert 'more.html' in paths
          assert 'href="./more.html">More' in home
          page = (root/'more.html').read_text()
          links = Links()
          links.feed(page)
          assert './#map' in links.hrefs and './#notifications' in links.hrefs
          project_sheets = [u for u in links.hrefs if re.fullmatch(r'https://docs.google.com/spreadsheets/d/[A-Za-z0-9_-]+/edit#gid=24061124', u)]
          assert len(project_sheets) == len(set(project_sheets)) == counts['projects']
          external = [u for u in links.hrefs if u.startswith('https://')]
          assert len(external) == len(set(external))
          assert all(re.fullmatch(r'https://(?:docs.google.com/(?:spreadsheets|document)/d/[A-Za-z0-9_-]+/edit(?:#gid=[0-9]+)?|drive.google.com/drive/folders/[A-Za-z0-9_-]+)', u) for u in external)
          assert 'Fishtail Builders — projects' in page and 'Rohini Engineering — projects' in page
          assert 'id="directory-search"' in page and 'data-jp-no-gallery' in page
          print('STATIC_DIRECTORY_LINKS_PASS', len(project_sheets), len(external))
          print('STATIC_ARTIFACT_VALIDATED', len(paths), counts)
      - name: Check delivered JavaScript syntax
        shell: bash
        run: find publication/static-operations -name '*.js' -type f -print0 | xargs -0 -r -n1 node --check
      - name: Upload exactly the prepared artifact on an owner-requested release
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[JP-OWNER-PUBLISH]')))
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication/static-operations
  deploy:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[JP-OWNER-PUBLISH]')))
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
  verify-live-pages:
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify every served file against the static release manifest
        shell: python
        run: |
          import hashlib, json, os, pathlib, time, urllib.request
          m = json.loads(pathlib.Path('publication/static-operations-manifest.json').read_text())
          base = 'https://fabingurung.github.io/jp-site-operations/'
          count = 0
          for name, digest in m['files'].items():
              if name == '.nojekyll': continue  # GitHub Pages need not serve control files.
              for attempt in range(10):
                  try:
                      url = base + name + '?commit=' + os.environ['GITHUB_SHA'] + '&attempt=' + str(attempt)
                      with urllib.request.urlopen(url, timeout=20) as response:
                          got = hashlib.sha256(response.read()).hexdigest()
                      if got == digest: break
                  except Exception:
                      pass
                  time.sleep(4)
              else:
                  raise RuntimeError('Deployed file mismatch: '+name)
              count += 1
          print('STATIC_LIVE_READBACK_PASS', count, m['counts'])
